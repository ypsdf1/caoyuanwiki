name: Issue Auto Reply & Labels

on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  auto-reply:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Add label and post comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const issueAuthor = context.payload.issue.user.login;
            const issueTitle  = context.payload.issue.title;
            const issueBody   = context.payload.issue.body || '';

            console.log(`触发 Issue #${issueNumber}，作者：${issueAuthor}`);

            // 0. 确保标签存在（不存在则创建，存在则不动）
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
                console.log(`标签 ${name} 不存在，已自动创建`);
              }
            };

            // 1. 判断是否来自申诉工单模板（标题前缀 或 正文特征片段，命中其一即可）
            const isAppeal =
              issueTitle.trim().startsWith('[申诉]') ||
              issueBody.includes('## ⚖️ 被处置信息') ||
              issueBody.includes('本工单用于对服务器处罚/账号处置提出申诉');
            console.log(`申诉工单判定：${isAppeal}`);

            // 2. 添加"待处理"标签；申诉工单追加"申诉状"标签
            await ensureLabel('待处理', '0e8a16', '待处理的工单');
            const labelsToAdd = ['待处理'];
            if (isAppeal) {
              await ensureLabel('申诉状', 'd93f0b', '由申诉工单模板提交的申诉');
              labelsToAdd.push('申诉状');
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber,
              labels: labelsToAdd
            });
            console.log(`标签添加完成：${labelsToAdd.join('、')}`);

            // 3. 自动回复
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber,
              body: [
                `👋 感谢 @${issueAuthor} 提交反馈！`,
                ``,
                `你的 Issue **#${issueNumber}**（${issueTitle}）已收到，已标记为 **待处理**，我们会尽快安排处理。`,
                ``,
                `---`,
                `> 📌 **温馨提示**：如果你的问题包含截图或详细的复现步骤，可以直接在此 Issue 下补充回复，有助于我们更快定位问题。`
              ].join('\n')
            });
            console.log('评论发布完成');

  label-on-close:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: 按关单原因贴标
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const reason = context.payload.issue.state_reason || '';
            console.log(`Issue #${issueNumber} 关单，state_reason=${reason || '(无)'}`);

            // 关单原因 → 目标标签
            const labelMap = {
              not_planned: { name: '已驳回', color: 'd73a4a', description: '不予处理/已驳回的工单' },
              completed:   { name: '已完成', color: '2ea44f', description: '已完成处理的工单' }
            };
            const target = labelMap[reason];

            // 关单前工单上已有的标签（用于判断是否已被标记"已撤销"）
            const currentLabels = (context.payload.issue.labels || [])
              .map(l => (typeof l === 'string' ? l : l.name));
            const hasCancelled = currentLabels.includes('已撤销');
            console.log(`现有标签：${currentLabels.join('、') || '(无)'}；含"已撤销"：${hasCancelled}`);

            // 确保标签存在（不存在则创建，存在则不动）
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
                console.log(`标签 ${name} 不存在，已自动创建`);
              }
            };

            // 已撤销：用户主动撤回反馈，无需继续跟进 → 只摘掉其它标签，保留"已撤销"，不追加终态标签
            if (hasCancelled) {
              await ensureLabel('已撤销', '6e7781', '用户主动撤销反馈，无需继续跟进');
              const others = currentLabels.filter(n => n !== '已撤销');
              for (const name of others) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name
                  });
                  console.log(`已摘除标签：${name}`);
                } catch (e) {
                  if (e.status !== 404) {
                    console.log(`摘除标签 ${name} 失败（可忽略）：${e.message}`);
                  }
                }
              }
              console.log('工单带"已撤销"标签，已摘除其它标签，不追加已完成/已驳回');
              return;
            }

            // 非撤销单：摘掉工单上的全部标签（仓库级标签定义不受影响）
            try {
              await github.rest.issues.removeAllLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              console.log('已清空工单原有标签');
            } catch (e) {
              console.log(`清空标签失败（可忽略）：${e.message}`);
            }

            if (!target) {
              console.log('关单原因不是 not_planned/completed，仅清空标签，不贴新标签');
              return;
            }

            await ensureLabel(target.name, target.color, target.description);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [target.name]
            });
            console.log(`已贴标：${target.name}`);

  label-on-reply:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.comment.user.login != 'github-actions[bot]' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: 工单作者或运维回复时贴已回复
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const commenter   = context.payload.comment.user.login;
            const issueAuthor  = context.payload.issue.user.login;
            const assoc       = context.payload.comment.author_association || 'NONE';

            const isAuthor = commenter === issueAuthor;
            const isMaintainer = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(assoc);
            console.log(`#${issueNumber} 评论者：${commenter}（关联：${assoc}），工单作者：${issueAuthor}`);
            if (!isAuthor && !isMaintainer) {
              console.log('非工单作者、也非仓库运维的评论，跳过贴标');
              return;
            }

            // 工单已关闭（关单后补发评论等场景）→ 不贴"已回复"，避免终态标签被覆盖
            if (context.payload.issue.state !== 'open') {
              console.log('工单已关闭，跳过贴"已回复"');
              return;
            }

            // 确保标签存在（不存在则创建，存在则不动）
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
                console.log(`标签 ${name} 不存在，已自动创建`);
              }
            };

            await ensureLabel('已回复', '1d76db', '工单作者或运维已回复');
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['已回复']
            });
            console.log('已贴标：已回复');

            // 作者本人回复命中"已解决/撤销"类关键词 → 机器人回条评论 → 贴"已撤销" → 关单
            if (!isAuthor) {
              console.log('非工单作者本人的评论，跳过撤销关键词判定');
              return;
            }
            if (context.payload.issue.state !== 'open') {
              console.log('工单已关闭，跳过撤销关键词判定');
              return;
            }

            const commentBody = context.payload.comment.body || '';
            // 否定表达优先排除，避免"没解决""无法撤销"被误判为撤销
            const negativeRe = /(没|未|没有|尚未|还没|仍未|不|无法|不能|别)(有)?\s*(解决|修复|搞定|修好|好|成功|恢复|撤销|取消|撤回)/;
            // 强报障表达：单独出现即判定"问题仍在"，直接不关
            const strongBrokenRe = /(还是|依然|仍然|依旧|仍旧|老是|一直|又)\s*(不|没|无法|有)|不行|用不了|不能用|进不去|打不开|掉线|闪退|崩了|报错|出错|还有问题|还是有问题|无法(登录|进入|连接)/;
            // 弱报障表达：仅在出现转折词时才拦（避免"不卡了"被误伤）
            const weakBrokenRe = /(卡|卡顿|延迟|掉帧|bug|BUG|问题)/;
            // 转折词：命中撤销词后又提问题，视为没真正解决，保守不关
            const contrastRe = /(但是|但|不过|可是|然而|只是|问题是)/;
            const cancelRes = [
              /已?解决/,
              /搞定|搞好了|修好了|修复了|已修复/,
              /可以了|没问题了|正常了|恢复了|已恢复/,
              /撤销|取消|撤回/,
              /不用(处理|管)?了|不需要了|算了|关(了|闭)吧/
            ];
            const hit       = cancelRes.some(re => re.test(commentBody));
            const negative  = negativeRe.test(commentBody);
            const strong    = strongBrokenRe.test(commentBody);
            const contrast  = contrastRe.test(commentBody);
            const weak      = weakBrokenRe.test(commentBody);
            // 转折词 + 任一报障（强或弱）→ 认为没真正解决
            const contrastBroken = contrast && (strong || weak);
            // 带问号或"吗"的视为提问，不算确认（如"现在可以了吗？"）
            const question  = /[？?]|吗/.test(commentBody);

            // 明确的二次确认口令（作者已明确要关单，可直接执行）
            const confirmPhraseRe = /确认(一下)?(关单|关闭|撤销)/;
            const notConfirmRe    = /(不|别|未|还没|没|尚未)\s*(要|需要)?\s*确认/;
            const isConfirm = confirmPhraseRe.test(commentBody) && !notConfirmRe.test(commentBody);

            console.log(`确认口令：${isConfirm}，撤销词：${hit}，否定：${negative}，强报障：${strong}，转折后报障：${contrastBroken}，提问：${question}`);

            // 守卫：存在否定 / 强报障 / 转折后报障 / 疑似提问 → 一律不推进关单
            if (negative || strong || contrastBroken || question) {
              console.log('存在否定/报障表达/疑似提问，不推进关单流程');
              return;
            }

            // 拉取工单当前标签（判断是否已处于待确认状态，避免重复发起二次确认）
            const issueData = await github.rest.issues.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber
            });
            const hasPending = issueData.data.labels.some(l => l.name === '待确认');

            // 关单动作：先回消息 → 摘待确认 → 贴已撤销 → 关单（让关单任务据此跳过已完成/已驳回）
            const doClose = async () => {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issueNumber,
                body: [
                  `🤖 已收到你的**二次确认**，正在为你关闭本工单并标记为 **已撤销**。`,
                  ``,
                  `> 若问题其实没解决，重新打开本工单并补充说明即可，我们会继续跟进。`
                ].join('\n')
              });
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: '待确认'
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              await ensureLabel('已撤销', '6e7781', '用户主动撤销反馈，无需继续跟进');
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['已撤销']
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'not_planned'
              });
              console.log('已二次确认关单并贴标：已撤销');
            };

            // 分支 A：作者已明确"确认关单" → 直接执行关单
            if (isConfirm) {
              await doClose();
              return;
            }

            // 分支 B：作者说了"解决了/撤销"等 → 发起二次确认（只发一次，避免刷屏）
            if (hit) {
              if (hasPending) {
                console.log('已处于待确认状态，避免重复发起二次确认');
                return;
              }
              await ensureLabel('待确认', 'f9d024', '等待作者二次确认关单');
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['待确认']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issueNumber,
                body: [
                  `🤖 收到 @${issueAuthor} 的反馈，检测到你想**撤销并关闭**本工单。`,
                  ``,
                  `为防止误关，需要你做**二次确认**：`,
                  `- 确认关单：请回复 **确认关单**`,
                  `- 尚未解决 / 无需关闭：请继续描述问题，或忽略本条`,
                  ``
                ].join('\n')
              });
              console.log('已发起二次确认');
              return;
            }

            // 未命中任何撤销 / 确认表达 → 保持工单开启
            console.log('未命中撤销或确认表达，保持工单开启');

  label-on-reopen:
    if: github.event_name == 'issues' && github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - name: 重开时摘除终态标签并回到待处理
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const issueAuthor = context.payload.issue.user.login;
            console.log(`Issue #${issueNumber} 被重新打开`);

            // 1. 拉取当前标签，判断此前是否为机器人"已撤销"关单（误关信号）
            const issueData = await github.rest.issues.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber
            });
            const hadCancelled = issueData.data.labels.some(l => l.name === '已撤销');

            // 2. 摘除终态标签 + 已撤销/待确认（存在才摘）
            for (const name of ['已驳回', '已完成', '已撤销', '待确认']) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name
                });
                console.log(`已摘除标签：${name}`);
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

            // 3. 确保标签存在（不存在则创建，存在则不动）
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
                console.log(`标签 ${name} 不存在，已自动创建`);
              }
            };

            // 4. 回到"待处理"
            await ensureLabel('待处理', '0e8a16', '待处理的工单');
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['待处理']
            });
            console.log('已贴标：待处理');

            // 5. 若此前是机器人"已撤销"关单 → 大概率误关，致歉
            if (hadCancelled) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issueNumber,
                body: [
                  `🙏 抱歉，@${issueAuthor}！之前可能误关了这个工单，已为你重新打开。`,
                  ``,
                  `我们已把它标记为 **待处理**。如果问题其实还没解决，请补充说明具体情况，我们会继续跟进；`,
                  `若只是误点重开，直接再关一次即可。`
                ].join('\n')
              });
              console.log('已就疑似误关致歉');
            }
