name: Issue Auto Reply & Labels

on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  auto-reply:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Add label and post comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const issueAuthor = context.payload.issue.user.login;
            const issueTitle  = context.payload.issue.title;
            const issueBody   = context.payload.issue.body || '';

            console.log(`触发 Issue #${issueNumber}，作者：${issueAuthor}`);

            // 0. 确保标签存在（不存在则创建，存在则不动）
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
                console.log(`标签 ${name} 不存在，已自动创建`);
              }
            };

            // 1. 判断是否来自申诉工单模板（标题前缀 或 正文特征片段，命中其一即可）
            const isAppeal =
              issueTitle.trim().startsWith('[申诉]') ||
              issueBody.includes('## ⚖️ 被处置信息') ||
              issueBody.includes('本工单用于对服务器处罚/账号处置提出申诉');
            console.log(`申诉工单判定：${isAppeal}`);

            // 2. 添加"待处理"标签；申诉工单追加"申诉状"标签
            await ensureLabel('待处理', '0e8a16', '待处理的工单');
            const labelsToAdd = ['待处理'];
            if (isAppeal) {
              await ensureLabel('申诉状', 'd93f0b', '由申诉工单模板提交的申诉');
              labelsToAdd.push('申诉状');
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber,
              labels: labelsToAdd
            });
            console.log(`标签添加完成：${labelsToAdd.join('、')}`);

            // 3. 自动回复
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber,
              body: [
                `👋 感谢 @${issueAuthor} 提交反馈！`,
                ``,
                `你的 Issue **#${issueNumber}**（${issueTitle}）已收到，已标记为 **待处理**，我们会尽快安排处理。`,
                ``,
                `---`,
                `> 📌 **温馨提示**：如果你的问题包含截图或详细的复现步骤，可以直接在此 Issue 下补充回复，有助于我们更快定位问题。`
              ].join('\n')
            });
            console.log('评论发布完成');

  label-on-close:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: 按关单原因贴标
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const reason = context.payload.issue.state_reason || '';
            console.log(`Issue #${issueNumber} 关单，state_reason=${reason || '(无)'}`);

            // 关单原因 → 目标标签
            const labelMap = {
              not_planned: { name: '已驳回', color: 'd73a4a', description: '不予处理/已驳回的工单' },
              completed:   { name: '已完成', color: '2ea44f', description: '已完成处理的工单' }
            };
            const target = labelMap[reason];

            // 关单前工单上已有的标签（用于判断是否已被标记"已撤销"）
            const currentLabels = (context.payload.issue.labels || [])
              .map(l => (typeof l === 'string' ? l : l.name));
            const hasCancelled = currentLabels.includes('已撤销');
            console.log(`现有标签：${currentLabels.join('、') || '(无)'}；含"已撤销"：${hasCancelled}`);

            // 确保标签存在（不存在则创建，存在则不动）
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
                console.log(`标签 ${name} 不存在，已自动创建`);
              }
            };

            // 已撤销：用户主动撤回反馈，无需继续跟进 → 只摘掉其它标签，保留"已撤销"（暗红），不追加终态标签
            if (hasCancelled) {
              await ensureLabel('已撤销', '8b0000', '用户主动撤销反馈，无需继续跟进');
              try {
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: '已撤销',
                  new_name: '已撤销',
                  color: '8b0000',
                  description: '用户主动撤销反馈，无需继续跟进'
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              const others = currentLabels.filter(n => n !== '已撤销');
              for (const name of others) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name
                  });
                  console.log(`已摘除标签：${name}`);
                } catch (e) {
                  if (e.status !== 404) {
                    console.log(`摘除标签 ${name} 失败（可忽略）：${e.message}`);
                  }
                }
              }
              console.log('工单带"已撤销"标签，已摘除其它标签，不追加已完成/已驳回');
              return;
            }

            // 非撤销单：摘掉工单上的全部标签（仓库级标签定义不受影响）
            try {
              await github.rest.issues.removeAllLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              console.log('已清空工单原有标签');
            } catch (e) {
              console.log(`清空标签失败（可忽略）：${e.message}`);
            }

            if (!target) {
              console.log('关单原因不是 not_planned/completed，仅清空标签，不贴新标签');
              return;
            }

            await ensureLabel(target.name, target.color, target.description);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [target.name]
            });
            console.log(`已贴标：${target.name}`);

  label-on-reply:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.comment.user.login != 'github-actions[bot]' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: 任何用户回复时贴已回复，待确认工单同步摘标
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const commenter   = context.payload.comment.user.login;
            const issueAuthor  = context.payload.issue.user.login;
            const assoc       = context.payload.comment.author_association || 'NONE';

            const isAuthor = commenter === issueAuthor;
            const isMaintainer = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(assoc);
            console.log(`#${issueNumber} 评论者：${commenter}（关联：${assoc}），工单作者：${issueAuthor}`);

            // 工单已关闭（关单后补发评论等场景）→ 不贴"已回复"，避免终态标签被覆盖
            if (context.payload.issue.state !== 'open') {
              console.log('工单已关闭，跳过贴"已回复"');
              return;
            }

            // 拉取工单最新标签（payload 快照可能滞后，摘标前以实时为准）
            const preCheckIssue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber
            });

            // 确保标签存在（不存在则创建，存在则不动）
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
                console.log(`标签 ${name} 不存在，已自动创建`);
              }
            };

            // 任何用户（不看身份）的回复：贴"已回复"；
            // 若工单正卡在"待确认"，同步摘除（工单不再永久停留待确认，交由人工/运维接管）
            await ensureLabel('已回复', '1d76db', '工单已收到回复');
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['已回复']
            });
            console.log('已贴标：已回复');
            if (preCheckIssue.data.labels.some(l => l.name === '待确认')) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  issue_number: issueNumber,
                  name: '待确认'
                });
                console.log('工单原处于待确认状态，收到新回复后已摘除"待确认"');
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

            // 作者本人回复命中"已解决/撤销"类关键词 → 机器人回条评论 → 贴"已撤销" → 关单
            if (!isAuthor) {
              console.log('非工单作者本人的评论，跳过撤销关键词判定');
              return;
            }
            if (context.payload.issue.state !== 'open') {
              console.log('工单已关闭，跳过撤销关键词判定');
              return;
            }

            const commentBody = context.payload.comment.body || '';

            // 明确的二次确认口令（作者已明确要关单，可直接执行）
            const confirmPhraseRe = /确认(一下)?(关单|关闭|撤销)/;
            const notConfirmRe    = /(不|别|未|还没|没|尚未)\s*(要|需要)?\s*确认/;
            const isConfirm = confirmPhraseRe.test(commentBody) && !notConfirmRe.test(commentBody);

            // 工单原处于待确认状态（非确认评论已在上面摘标）→ 仅带确认口令才继续关单流程
            const hasPending = preCheckIssue.data.labels.some(l => l.name === '待确认');
            if (hasPending && !isConfirm) {
              console.log('工单原处于待确认状态且当前评论未带确认口令，跳过关单判定');
              return;
            }

            // 否定表达优先排除，避免"没解决""无法撤销"被误判为撤销
            const negativeRe = /(没|未|没有|尚未|还没|仍未|不|无法|不能|别)(有)?\s*(解决|修复|搞定|修好|好|成功|恢复|撤销|取消|撤回)/;
            // 强报障表达：单独出现即判定"问题仍在"，直接不关
            const strongBrokenRe = /(还是|依然|仍然|依旧|仍旧|老是|一直|又)\s*(不|没|无法|有)|不行|用不了|不能用|进不去|打不开|掉线|闪退|崩了|报错|出错|还有问题|还是有问题|无法(登录|进入|连接)/;
            // 弱报障表达：仅在出现转折词时才拦（避免"不卡了"被误伤）
            const weakBrokenRe = /(卡|卡顿|延迟|掉帧|bug|BUG|问题)/;
            // 转折词：命中撤销词后又提问题，视为没真正解决，保守不关
            const contrastRe = /(但是|但|不过|可是|然而|只是|问题是)/;
            // 解决类语义：问题已修复 → 关单贴绿色"已完成"
            const resolveRes = [
              /已?解决/,
              /搞定|搞好了|修好了|修复了|已修复/,
              /可以了|没问题了|正常了|恢复了|已恢复/
            ];
            // 撤回类语义：用户撤回反馈 → 关单贴暗红"已撤销"
            const withdrawRes = [
              /撤销|取消|撤回/,
              /不用(处理|管)?了|不需要了|算了|关(了|闭)吧/
            ];
            const resolveHit  = resolveRes.some(re => re.test(commentBody));
            const withdrawHit = withdrawRes.some(re => re.test(commentBody));
            const hit         = resolveHit || withdrawHit;
            const negative  = negativeRe.test(commentBody);
            const strong    = strongBrokenRe.test(commentBody);
            const contrast  = contrastRe.test(commentBody);
            const weak      = weakBrokenRe.test(commentBody);
            // 转折词 + 任一报障（强或弱）→ 认为没真正解决
            const contrastBroken = contrast && (strong || weak);
            // 带问号或"吗"的视为提问，不算确认（如"现在可以了吗？"）
            const question  = /[？?]|吗/.test(commentBody);

            console.log(`确认口令：${isConfirm}，撤销词：${hit}，否定：${negative}，强报障：${strong}，转折后报障：${contrastBroken}，提问：${question}`);

            // 守卫：存在否定 / 强报障 / 转折后报障 / 疑似提问 → 一律不推进关单
            if (negative || strong || contrastBroken || question) {
              console.log('存在否定/报障表达/疑似提问，不推进关单流程');
              return;
            }

            // 拉取工单实时标签，校验当前是否仍处于待确认（分支 B 防重复发二次确认用）
            const issueData = await github.rest.issues.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber
            });
            const isPendingNow = issueData.data.labels.some(l => l.name === '待确认');

            // 工单原处于待确认状态且当前评论未带明确确认口令 → 跳过（保持人工跟进）
            // 避免作者此时再说"解决了/算了"触发"回扫历史"重复拉二次确认
            if (hasPending && !isConfirm) {
              console.log('工单原处于待确认状态且当前评论未带确认口令，跳过');
              return;
            }

            // 非明确关单语义（既非"确认关单"口令、也未命中解决/撤回词）→ 跳过
            // 原则：宁可少关 1 个也不错关，未识别的意图交给人工跟进
            if (!isConfirm && !hit) {
              console.log('未识别出明确关单语义，不自动关单（保持人工跟进）');
              return;
            }

            // 语义判定（沿用守卫：否定 / 报障 / 提问的评论一律不认）
            const intentOf = (body) => {
              const b = body || '';
              if (negativeRe.test(b) || strongBrokenRe.test(b)) return null;
              if (contrastRe.test(b) && (weakBrokenRe.test(b) || strongBrokenRe.test(b))) return null;
              if (/[？?]|吗/.test(b)) return null;
              if (resolveRes.some(re => re.test(b))) return 'resolved';
              if (withdrawRes.some(re => re.test(b))) return 'withdrawn';
              return null;
            };

            // 判定关单语义：当前评论命中则直接用；否则（如只回了"确认关单"）
            // 回扫工单历史评论（由近及远）找作者最早一次明确的意图；
            // 若仍查不到 → 跳过不关（原则：语义不明确则宁可少关 1 个也不错关）
            let intent = intentOf(commentBody);
            if (!intent) {
              try {
                const history = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  issue_number: issueNumber,
                  per_page: 100
                });
                const authorBodies = history.data
                  .filter(c => c.user && c.user.login === issueAuthor)
                  .map(c => c.body)
                  .reverse();
                for (const body of authorBodies) {
                  const t = intentOf(body);
                  if (t) { intent = t; break; }
                }
              } catch (e) {
                console.log('拉取评论历史失败（忽略）：' + e.message);
              }
            }
            if (!intent) {
              console.log('历史中未识别出明确的解决/撤回语义，不自动关单（保持人工跟进）');
              return;
            }
            const finalLabel = intent === 'resolved'
              ? { name: '已完成', color: '2ea44f', description: '已完成处理的工单' }
              : { name: '已撤销', color: '8b0000', description: '用户主动撤销反馈，无需继续跟进' };
            const finalReason = intent === 'resolved' ? 'completed' : 'not_planned';
            console.log(`关单语义判定：${finalLabel.name}（state_reason=${finalReason}）`);

            // 同步标签：已存在则更新颜色/描述（保证旧灰色"已撤销"改成暗红），不存在则创建
            const syncLabel = async (name, color, description) => {
              try {
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  new_name: name,
                  color,
                  description
                });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
                console.log(`标签 ${name} 不存在，已自动创建`);
              }
            };

            // 关单动作：先回消息 → 摘全部标签 → 贴对应终态标签 → 关单
            // （state_reason 与标签匹配，关单任务 label-on-close 会复核：
            //  驳回→已驳回 / 完结→已完成 / 已撤销→保留已撤销，终态标签保持一致）
            const doClose = async () => {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issueNumber,
                body: [
                  `🤖 已收到你的**二次确认**，正在为你关闭本工单并标记为 **${finalLabel.name}**。`,
                  ``,
                  `> 若有误会，重新打开本工单并补充说明即可，我们会继续跟进。`
                ].join('\n')
              });
              // ★ 摘掉全部标签（含"待确认"及其它流程标签），只保留即将贴的对应终态标签
              try {
                await github.rest.issues.removeAllLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                console.log('已摘除工单全部标签');
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              await syncLabel(finalLabel.name, finalLabel.color, finalLabel.description);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [finalLabel.name]
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: finalReason
              });
              console.log(`已关单并贴标：${finalLabel.name}`);
            };

            // 分支 A：作者已明确"确认关单" → 直接执行关单
            if (isConfirm) {
              await doClose();
              return;
            }

            // 分支 B：作者说了"解决了/撤销"等 → 发起二次确认（只发一次，避免刷屏）
            if (hit) {
              if (isPendingNow) {
                console.log('工单仍处于待确认状态，避免重复发起二次确认');
                return;
              }
              await ensureLabel('待确认', 'f9d024', '等待作者二次确认关单');
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['待确认']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issueNumber,
                body: [
                  `🤖 收到 @${issueAuthor} 的反馈，${resolveHit ? '检测到**问题已解决**' : '检测到你想**撤销**本工单'}。`,
                  ``,
                  `为防止误关，需要你做**二次确认**：`,
                  `- 确认关单：请回复 **确认关单**`,
                  `- 尚未解决 / 无需关闭：请继续描述问题，或忽略本条`,
                  ``
                ].join('\n')
              });
              console.log('已发起二次确认');
              return;
            }

            // 未命中任何撤销 / 确认表达 → 保持工单开启
            console.log('未命中撤销或确认表达，保持工单开启');

  label-on-reopen:
    if: github.event_name == 'issues' && github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - name: 重开时摘除终态标签并回到待处理
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const issueAuthor = context.payload.issue.user.login;
            console.log(`Issue #${issueNumber} 被重新打开`);

            // 1. 拉取当前标签，判断此前是否为机器人"已撤销"关单（误关信号）
            const issueData = await github.rest.issues.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber
            });
            const hadCancelled = issueData.data.labels.some(l => l.name === '已撤销');

            // 2. 摘除终态标签 + 已撤销/待确认（存在才摘）
            for (const name of ['已驳回', '已完成', '已撤销', '待确认']) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name
                });
                console.log(`已摘除标签：${name}`);
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

            // 3. 确保标签存在（不存在则创建，存在则不动）
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
                console.log(`标签 ${name} 不存在，已自动创建`);
              }
            };

            // 4. 回到"待处理"
            await ensureLabel('待处理', '0e8a16', '待处理的工单');
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['待处理']
            });
            console.log('已贴标：待处理');

            // 5. 若此前是机器人"已撤销"关单 → 大概率误关，致歉
            if (hadCancelled) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issueNumber,
                body: [
                  `🙏 抱歉，@${issueAuthor}！之前可能误关了这个工单，已为你重新打开。`,
                  ``,
                  `我们已把它标记为 **待处理**。如果问题其实还没解决，请补充说明具体情况，我们会继续跟进；`,
                  `若只是误点重开，直接再关一次即可。`
                ].join('\n')
              });
              console.log('已就疑似误关致歉');
            }
